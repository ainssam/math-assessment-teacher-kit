packages:
  - "apps/*"

overrides:
  postcss: 8.5.32
  sharp: 0.35.5
  # Scope security overrides to the development tools that need them.
  "onnxruntime-node>adm-zip": 0.6.1
  "@typescript-eslint/typescript-estree>minimatch": 11.0.5

allowBuilds:
  esbuild: true
  # The catalog build does not import these native/protobuf install hooks.
  # Keep them disabled rather than implicitly approving third-party scripts.
  onnxruntime-node: false
  protobufjs: false
  sharp: true
  unrs-resolver: true
